<!doctype html>
<html lang="en" data-kind="play">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Menu</title>
<style>
:root{
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",Georgia,serif;
  --sans:"Avenir Next","Segoe UI",Candara,"Trebuchet MS",sans-serif;
  --r-sm:3px; --r-lg:10px;
}
/* Play Menu: a library catalogue, grey-green paper and oxblood ink */
html[data-kind=play]{--bg:#EDF0EA;--panel:#F7F8F4;--ink:#1E2A30;--muted:#5D6A65;--rule:#C8CFC4;--accent:#8A2B35;--accent-ink:#FFF;--tint:#F1E1DF;--star:#8A6A1E;--focus:#2F6F86}
/* Magic Menu: an indigo night, gold for the seal, violet for the Standard star */
html[data-kind=magic]{--bg:#171C2B;--panel:#1F2639;--ink:#E6E2D5;--muted:#9AA0B2;--rule:#33405C;--accent:#C9A44C;--accent-ink:#1A1A1A;--tint:#2E2A22;--star:#A796E0;--focus:#7FC4D8}
@media (prefers-color-scheme:dark){
  html[data-kind=play]{--bg:#1A2125;--panel:#212A2F;--ink:#E3E6DF;--muted:#9BA6A1;--rule:#36434A;--accent:#D9767F;--accent-ink:#1A1A1A;--tint:#3A2A2D;--star:#D4B160;--focus:#7FC4D8}
}
@media (prefers-color-scheme:light){
  html[data-kind=magic]{--bg:#ECEAF2;--panel:#F7F6FA;--ink:#221F33;--muted:#5F5B74;--rule:#CFCADF;--accent:#7A5C14;--accent-ink:#FFF;--tint:#EFE6CF;--star:#5B4A9E;--focus:#2F6F86}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--serif)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}
header.top{padding:40px 0 20px;border-bottom:1px solid var(--rule)}
header.top h1{font-size:clamp(2.2rem,5vw,3.6rem);line-height:1;margin:0 0 6px;font-weight:600;letter-spacing:-.01em}
header.top .ver{color:var(--muted);font-family:var(--sans);font-size:.85rem;margin:0 0 14px}
header.top p.lede{max-width:68ch;margin:0;color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.tools input[type=search]{flex:1 1 240px;max-width:420px;padding:9px 12px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--panel)}
.btn{border:1px solid var(--rule);background:var(--panel);padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-family:var(--sans);font-size:.9rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;gap:28px;padding:24px 0 120px}
nav.rail{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;font-family:var(--sans);font-size:.88rem}
nav.rail h2{font:600 .95rem var(--serif);margin:14px 0 4px;color:var(--muted)}
nav.rail a{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;color:var(--ink);text-decoration:none;border-radius:var(--r-sm)}
nav.rail a:hover{background:var(--panel)}
nav.rail a .n{color:var(--muted)}
nav.rail a.has .n{color:var(--accent);font-weight:700}
nav.rail a.oc .n{color:var(--star)}
main{min-width:0}
section.cat{padding:22px 0 26px;border-bottom:1px solid var(--rule)}
section.cat[hidden]{display:none}
.cat-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.cat-head h2{margin:0;font-size:1.55rem;font-weight:600}
.cat-head h2 .num{color:var(--muted);font-weight:400;margin-right:8px}
.badge{font-family:var(--sans);font-size:.78rem;color:var(--muted);border:1px solid var(--rule);padding:1px 8px;border-radius:99px}
.cat-sets{font-family:var(--sans);font-size:.82rem;color:var(--muted);margin:4px 0 0}
details.about{margin:8px 0 0;max-width:72ch}
details.about summary{cursor:pointer;color:var(--muted);font-family:var(--sans);font-size:.85rem}
details.about p{margin:6px 0 0;font-size:.95rem}
.cat-tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.oc-btn[aria-pressed=true]{background:var(--star);color:var(--bg);border-color:var(--star)}
.cat.is-oc .opts{opacity:.45}
.sub h3{font-size:1.05rem;margin:18px 0 6px;font-weight:600}
.grp{font-family:var(--sans);font-size:.8rem;color:var(--muted);margin:14px 0 4px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 18px}
.opt{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;text-align:left;width:100%;background:none;border:0;border-top:1px dotted var(--rule);padding:9px 6px 9px 2px;cursor:pointer;border-radius:0}
.opt:hover{background:var(--panel)}
.opt .seal{width:18px;height:18px;margin-top:3px;border:1.5px solid var(--muted);border-radius:50%;position:relative}
.sub[data-mode=one] .opt .seal{border-radius:50%}
.sub[data-mode=several] .opt .seal{border-radius:4px}
.opt[aria-pressed=true]{background:var(--tint)}
.opt[aria-pressed=true] .seal{background:var(--accent);border-color:var(--accent)}
.opt[aria-pressed=true] .seal::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.opt .nm{font-weight:600}
.opt .star{color:var(--star);margin-left:4px}
.opt .ds{display:block;font-size:.88rem;color:var(--muted);line-height:1.4;margin-top:1px}
.opt .rolled{font-family:var(--sans);font-size:.72rem;color:var(--accent);margin-left:6px}
.opt[hidden]{display:none}
aside.slip{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-lg);padding:18px}
aside.slip h2{margin:0 0 4px;font-size:1.3rem}
aside.slip .sub2{color:var(--muted);font-family:var(--sans);font-size:.82rem;margin:0 0 12px}
.slip ul{list-style:none;padding:0;margin:0}
.slip li{padding:7px 0;border-top:1px dotted var(--rule);font-size:.93rem}
.slip li b{display:block;font-size:.78rem;font-family:var(--sans);color:var(--muted);font-weight:600}
.slip li.oc span{color:var(--star)}
.slip li.tune b::after{content:" · tuning";color:var(--accent)}
.slip .empty{color:var(--muted);font-size:.93rem}
.slip .left{margin-top:12px;font-size:.85rem;color:var(--muted)}
.slip .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.slip textarea{width:100%;min-height:140px;margin-top:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--rule);border-radius:var(--r-sm);padding:8px}
.toast{font-family:var(--sans);font-size:.82rem;color:var(--accent);min-height:1.2em;margin-top:6px}
.approach{margin:22px 0 0;padding:18px;border:1px solid var(--accent);border-radius:var(--r-lg);background:var(--panel)}
.approach h2{margin:0 0 8px;font-size:1.35rem}
.approach .opts{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.std-note{margin:16px 0 0;padding:14px 16px;border-left:3px solid var(--star);background:var(--panel);max-width:72ch}
.groups-hide section.cat{display:none}
.mob-slip{display:none}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 320px}nav.rail{display:none}}
@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  aside.slip{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:70vh;padding-bottom:72px;border-radius:var(--r-lg) var(--r-lg) 0 0;transform:translateY(calc(100% - 0px));transition:transform .2s;z-index:5}
  aside.slip.open{transform:none}
  .mob-slip{display:block;position:fixed;right:16px;bottom:16px;z-index:6}
  body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1 id="title"></h1>
  <p class="ver" id="ver"></p>
  <p class="lede" id="lede"></p>
  <div class="tools">
    <input type="search" id="q" placeholder="Search options" aria-label="Search options">
    <button class="btn" id="rollCore"></button>
    <button class="btn" id="reset">Clear all</button>
  </div>
  <div id="approachBox"></div>
</header>
<div class="layout">
  <nav class="rail" id="rail" aria-label="Categories"></nav>
  <main id="main"></main>
  <aside class="slip" id="slip" aria-label="Your picks">
    <h2>Your picks</h2>
    <p class="sub2">Copy this into the conversation when you are done.</p>
    <div id="slipBody"></div>
    <div class="acts">
      <button class="btn primary" id="copy">Copy picks</button>
      <button class="btn" id="show">Show as text</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <textarea id="out" hidden readonly aria-label="Picks as text"></textarea>
  </aside>
</div>
</div>
<button class="btn primary mob-slip" id="mobSlip">Your picks</button>
<script>

val Europe; Renaissance; American Colonies; Western / Old West; Regency Era; London Season; Victorian Era; Edwardian Era; Industrial Revolution; Cold War; Contemporary; World War I; Roaring Twenties.", "sets": "Setting and world rules; Causal Standard; the magic Specification and its Disclosure Profile (§25)", "subs": [{"name": "", "mode": "several", "options": [{"name": "Ancient Egypt", "desc": "", "group": ""}, {"name": "Classical Greece", "desc": "", "group": ""}, {"name": "Roman Empire", "desc": "", "group": ""}, {"name": "Tang Dynasty China", "desc": "", "group": ""}, {"name": "Sengoku Period Japan", "desc": "", "group": ""}, {"name": "Mughal India", "desc": "", "group": ""}, {"name": "Aztec Empire", "desc": "", "group": ""}, {"name": "Medieval Europe", "desc": "", "group": ""}, {"name": "Renaissance", "desc": "", "group": ""}, {"name": "American Colonies", "desc": "", "group": ""}, {"name": "Western / Old West", "desc": "", "group": ""}, {"name": "Regency Era", "desc": "", "group": ""}, {"name": "London Season", "desc": "", "group": ""}, {"name": "Victorian Era", "desc": "", "group": ""}, {"name": "Edwardian Era", "desc": "", "group": ""}, {"name": "Industrial Revolution", "desc": "", "group": ""}, {"name": "Cold War", "desc": "", "group": ""}, {"name": "Contemporary", "desc": "", "group": ""}, {"name": "World War I", "desc": "", "group": ""}, {"name": "Roaring Twenties", "desc": "", "group": ""}, {"name": "Mesopotamia / Babylon", "desc": "c. 3000 to 539 BC · The first cities, law codes and temple economies", "group": ""}, {"name": "Achaemenid Persia", "desc": "550 to 330 BC · A vast tolerant empire of satraps and roads", "group": ""}, {"name": "Warring States China", "desc": "475 to 221 BC · Seven kingdoms, strategists and the road to unification", "group": ""}, {"name": "Three Kingdoms China", "desc": "AD 184 to 280 · Warlords, sworn brothers and legendary strategy", "group": ""}, {"name": "Byzantine Empire", "desc": "330 to 1453 · Court intrigue, theology and a thousand-year siege mentality", "group": ""}, {"name": "Abbasid Caliphate", "desc": "750 to 1258 · Baghdad, scholarship and the House of Wisdom", "group": ""}, {"name": "Viking Age", "desc": "c. 793 to 1066 · Raiders, traders, settlers and sagas", "group": ""}, {"name": "Heian Japan", "desc": "794 to 1185 · Court poetry, rank and refined intrigue", "group": ""}, {"name": "The Crusades", "desc": "1095 to 1291 · Holy war, crusader states and shifting alliances", "group": ""}, {"name": "Mongol Empire", "desc": "1206 to 1368 · Steppe conquest on a continental scale", "group": ""}, {"name": "Mali Empire", "desc": "c. 1235 to 1600 · Gold, salt and Timbuktu's learning", "group": ""}, {"name": "Ottoman Empire", "desc": "1299 to 1922 · The Sublime Porte, janissaries and the harem politics of succession", "group": ""}, {"name": "Joseon Korea", "desc": "1392 to 1897 · Confucian court, yangban and palace politics", "group": ""}, {"name": "Inca Empire", "desc": "1438 to 1533 · Mountain roads, quipu and a sun-king state", "group": ""}, {"name": "Elizabethan England", "desc": "1558 to 1603 · Spies, playhouses and a Protestant queen at bay", "group": ""}, {"name": "Edo Japan", "desc": "1603 to 1868 · Peace under the shogunate; samurai without wars", "group": ""}, {"name": "Golden Age of Piracy", "desc": "c. 1650 to 1730 · Caribbean sea-roving, prizes and pardons", "group": ""}, {"name": "French Revolution", "desc": "1789 to 1799 · Terror, virtue and the guillotine", "group": ""}, {"name": "Napoleonic Wars", "desc": "1803 to 1815 · Empire, coalition and the age of the line battle", "group": ""}, {"name": "Zulu Kingdom", "desc": "1816 to 1897 · Shaka's rise, regiments and war with empires", "group": ""}, {"name": "Meiji Restoration", "desc": "1868 to 1912 · A feudal nation industrializing at speed", "group": ""}, {"name": "Belle Époque", "desc": "1871 to 1914 · Paris, salons and a peace about to end", "group": ""}, {"name": "Great Depression", "desc": "1929 to 1939 · Dust, breadlines and desperate enterprise", "group": ""}, {"name": "World War II", "desc": "1939 to 1945 · Total war on every front", "group": ""}]}]}, {"id": "c6", "num": 6, "name": "Sci-Fi Settings", "intro": "The science fiction settings below are drawn from the standard subgenre catalogues (Worlds Without End) and from the reference menu the User supplied, recast as places to play. A Hard Sci-Fi story type raises the Causal Standard (§15.11) in whichever of these is picked.", "sets": "Setting and world rules; Causal Standard; the magic Specification and its Disclosure Profile (§25)", "subs": [{"name": "", "mode": "several", "options": [{"name": "Space Opera", "desc": "Faster-than-light travel, empires, aliens and grand stakes", "group": ""}, {"name": "Space", "desc": "The frontier itself: vacuum, zero gravity and distance", "group": ""}, {"name": "Far Future", "desc": "Civilizations so advanced their technology is unrecognizable", "group": ""}, {"name": "Galactic Empire", "desc": "A galaxy-spanning polity at its height, or its fall", "group": ""}, {"name": "Galactic Federation", "desc": "A multi-species alliance run on diplomacy and intrigue", "group": ""}, {"name": "Galactic Federation Government", "desc": "An interstellar bureaucracy of senates and committees", "group": ""}, {"name": "Grimdark Religious Imperium", "desc": "Zealous far-future humanity crusading in cathedral-warships", "group": ""}, {"name": "Militarized Earth vs the Other", "desc": "A united, nationalistic humanity at war with alien threats", "group": ""}, {"name": "Military Sci-Fi", "desc": "Interstellar war from the soldier's or the admiral's seat", "group": ""}, {"name": "Cyberpunk", "desc": "High tech, low life: megacorporations, implants and street survival", "group": ""}, {"name": "Biopunk", "desc": "Gene-hacking, engineered bodies and biotech corporations", "group": ""}, {"name": "Nanopunk", "desc": "Molecular machines, and control at microscopic scale", "group": ""}, {"name": "Solarpunk", "desc": longer than a lifetime; the ship is the world", "group": ""}, {"name": "Terraforming", "desc": "Remaking a hostile world to be habitable", "group": ""}, {"name": "Space Station / Habitat", "desc": "A closed community in orbit or deep space", "group": ""}, {"name": "Asteroid Belt Frontier", "desc": "Miners, prospectors and lawless rock-towns", "group": ""}, {"name": "Megastructure / Dyson Sphere", "desc": "Life on a ringworld, Dyson swarm or arcology", "group": ""}, {"name": "Underwater City", "desc": "Pressure, darkness and isolation beneath an ocean", "group": ""}, {"name": "Time Travel", "desc": "Moving through time, and paying for what changes", "group": ""}, {"name": "Parallel Worlds", "desc": "Crossing into alternate versions of reality", "group": ""}, {"name": "Alternate History", "desc": "History that turned differently at a known point", "group": ""}, {"name": "AI Society", "desc": "A world run by, or shared with, artificial minds", "group": ""}, {"name": "Mind Uploading / Digital Afterlife", "desc": "Minds moved into machines, and what they become", "group": ""}, {"name": "Post-Singularity", "desc": "Beyond runaway technological change; humanity outpaced", "group": ""}, {"name": "Transhumanist / Posthuman", "desc": "Augmented people and the question of what counts as human", "group": ""}, {"name": "Uplifted Animals", "desc": "Animals raised to human-level intelligence, and their standing", "group": ""}, {"name": "Mutants", "desc": "Humans changed by mutation into something else", "group": ""}, {"name": "Dying Earth", "desc": "The far future, a failing sun and old ruins", "group": ""}, {"name": "Dystopian State", "desc": "A controlled society presented as ideal (see also section 8)", "group": ""}, {"name": "Utopia", "desc": "An apparently ideal society, and what holds it together", "group": ""}, {"name": "Fully Automated Luxury Space Communism", "desc": "Post-scarcity plenty and universal equality, run by machines", "group": ""}, {"name": "Climate Fiction", p": ""}, {"name": "Pandemic", "desc": "A plague that emptied the cities", "group": ""}, {"name": "Local Plague (Black Death)", "desc": "A plague that killed nearly everyone in one city or region", "group": ""}, {"name": "Zombie Outbreak", "desc": "The dead walk, and the living turn on each other", "group": ""}, {"name": "Fungal Infection", "desc": "A spreading infection that remakes hosts", "group": ""}, {"name": "Climate Collapse", "desc": "Floods, heat, extreme weather and resource wars", "group": ""}, {"name": "Impact Event", "desc": "An asteroid or comet, and the winter after", "group": ""}, {"name": "Supervolcano", "desc": "Ash skies and a volcanic winter", "group": ""}, {"name": "Endless Winter", "desc": "The world froze and stays frozen", "group": ""}, {"name": "Machine Uprising", "desc": "AI or robots took over; humanity survives on the margins", "group": ""}, {"name": "Alien Occupation", "desc": "Earth conquered; resistance, collaborators and rebels", "group": ""}, {"name": "Grid Collapse / Solar Flare / EMP", "desc": "Electricity and electronics wiped out, and never restored", "group": ""}, {"name": "Resource Exhaustion", "desc": "Oil, water or soil ran out", "group": ""}, {"name": "Demographic Collapse", "desc": "Birth rates fell until society could not sustain itself", "group": ""}, {"name": "Dysgenic Collapse", "desc": "Humanity's capacities declined until civilization could not be maintained", "group": ""}, {"name": "Bioweapon", "desc": "An engineered agent that escaped", "group": ""}, {"name": "Nanotech Plague", "desc": "Self-replicating machines that consumed the world", "group": ""}, {"name": "Rapture / Divine Judgment", "desc": "The faithful taken, and those left behind face tribulation", "group": ""}, {"name": "Magical Cataclysm", "desc": "A spell, rift or dead god broke the world", "group": ""}, {"name": "Cosmic Event", "desc": "A dying sun, a destroyed moon, or something from outside", "group": ""}, {"name": "System Apocalypse", "desc": "An alien or divine System imposed game rules on reality", "group": ""}, {"name": "Monster Emergence", "desc": "Gates, dungeons or kaiju opened on the world", "group": ""}, {"name": "Mysteriously Empty World", "desc": "Almost everyone is simply gone: empty cities, abandoned cars", "group": ""}, {"name": "Unknown Cause", "desc": "Nobody remembers what happened, and that is the mystery", "group": ""}]}, {"name": "How long after", "mode": "several", "options": [{"name": "The Fall", "desc": "During the collapse itself: the first days", "group": ""}, {"name": "Early Aftermath", "desc": "Months or years later; scavenging what remains", "group": ""}, {"name": "Settled Wasteland", "desc": "Decades later: raiders, trading towns, warlords", "group": ""}, {"name": "New Feudalism", "desc": "Generations later: new kingdoms on old ruins", "group": ""}, {"name": "Forgotten Past", "desc": "Centuries later: the old world is myth and relic", "group": ""}, {"name": "Rebuilding", "desc": "A civilization rising again, and arguing over what to keep", "group": ""}]}, {"name": "What the aftermath looks like", "mode": "several", "options": [{"name": "Nuclear Wasteland", "desc": "Radiation, mutants and scavenging in ruins", "group": ""}, {"name": "Retro-Nuclear", "desc": "A 1950s retro-futurist wasteland of vault dwellers and atomic kitsch", "group": ""}, {"name": "Bunker / Vault Society", "desc": "Survival underground, sealed experiments, and emergence into a changed world", "group": ""}, {"name": "Road-Warrior Wasteland", "desc": "Vehicle combat, fuel as currency, and roaming war-bands", "group": ""}, {"name": "Drowned World", "desc": "Flooded earth, floating towns and ocean raiders", "group": ""}, {"name": "Frozen Waste", "desc": "Heat is life; cities cluster around the last furnaces", "group": ""}, {"name": "Overgrown Ruins", "desc": "Nature has reclaimed the cities", "group": ""}, {"name": "Quarantine Zones", "desc": "Walled safe-zones and the infected lands beyond", "group": ""}, {"name": "Occupied Earth", "desc": "The conquerors' order, and the people living under it", "group": ""}]}]}, {"id": "c8", "num": 8, "name": "Dark World Settings", "intro": "Dark World settings are worlds whose default state is hostile, corrupt or dreadful, not merely dangerous. They pair naturally with a high Resistance and a low Plot Protection, and the Intensity Ceiling and Content Dials decide how much of the darkness is rendered.", "sets": "Setting and world rules; Causal Standard; the magic Specification and its Disclosure Profile (§25)", "subs": [{"name": "", "mode": "several", "options": [{"name": "Grimdark", "desc": "Everyone is compromised; power is violence; hope is expensive", "group": ""}, {"name": "Gothic", "desc": "Decaying houses, family curses, secrets and the uncanny", "group": ""}, {"name": "Cosmic Horror", "desc": "Vast indifferent powers beside which humanity is insignificant", "group": ""}, {"name": "Folk Horror", "desc": "An isolated community, old customs, and what they demand", "group": ""}, {"name": "Totalitarian Dystopia", "desc": "A state that watches, rewrites and punishes", "group": ""}, {"name": "Corporate Dystopia", "desc": "Companies are the government, and people are assets", "group": ""}, {"name": "Surveillance State", "desc": "Nothing unrecorded; privacy is a crime", "group": ""}, {"name": "Eternal War", "desc": "A war older than anyone living, and no end in sight", "group": ""}, {"name": "Plague City", "desc": "Quarantine walls, doctors in masks, and the dying", "group": ""}, {"name": "Vampire-Ruled World", "desc": "The night has an aristocracy, and humans are its livestock", "group": ""}, {"name": "Monster-Ruled World", "desc": "Humanity is prey, pet or servant", "group": ""}, {"name": "Occupied Homeland", "desc": "Foreign rule, collaborators and resistance", "group": ""}, {"name": "Slaver Empire", "desc": "An economy built on bondage, and its cruelties", "group": ""}, {"name": "Witch-Hunt Era", "desc": "Accusation, trial and fire", "group": ""}, {"name": "Cursed Land", "desc": "A blight on the land, and the reason for it", "group": ""}, {"name": "Hell / Underworld", "desc": "Damnation as a place with its own politics", "group": ""}, {"name": "Purgatory", "desc": "A waiting place between judgment and fate", "group": ""}, {"name": "Nightmare Realm", "desc": "A world made of fear, dreams and their logic", "group": ""}, {"name": "Dead Gods", "desc": "The gods are dead or gone, and something else is filling the space", "group": ""}, {"name": "Sunless World", "desc": "The sun has not risen in living memory", "group": ""}, {"name": "Prison World", "desc": "A penal planet, dungeon or city no one leaves", "group": ""}, {"name": "Fallen Empire", "desc": "The glory is over; the ruins are dangerous; the heirs are worse", "group": ""}, {"name": "Body Horror", "desc": "Flesh changing, merging or being remade", "group": ""}, {"name": "Death Game", "desc": "Captives forced to play for their lives", "group": ""}, {"name": "Monster Hunter's World", "desc": "Horrors are real, and a few people hunt them for pay", "group": ""}]}]}, {"id": "c9", "num": 9, "name": "Trope Fusion Settings", "intro": "A Trope Fusion joins two settings or genres that are rarely seen together, and its interest lies in where the two rule-sets collide. The first group are established hybrids (Weird Western; TCK Publishing on hybrid genres); the second are fusions composed for this Menu.", "sets": "Setting and world rules; Causal Standard; the magic Specification and its Disclosure Profile (§25)", "subs": [{"name": "", "mode": "several", "options": [{"name": "Weird West", "desc": "Western + supernatural · Gunslingers against curses, spirits and monsters", "group": ""}, {"name": "Space Western", "desc": "Western + space · Frontier law on distant worlds", "group": ""}, {"name": "Steampunk Western", "desc": "Western + retro-technology · Clockwork and steam on the railroad frontier", "group": ""}, {"name": "Gaslamp Fantasy", "desc": "Victorian + fantasy · Fog, gaslight and faerie bargains", "group": ""}, {"name": "Gothic Punk", "desc": "Gothic + steampunk · Brass machines in a haunted city", "group": ""}, {"name": "Science Fantasy", "desc": "Science fiction + fantasy · Starships and sorcery on the same map", "group": ""}, {"name": "Sword and Planet", "desc": "Sword and sorcery + alien worlds · Swordplay under two moons", "group": ""}, {"name": "Flintlock Fantasy", "desc": "Musket era + magic · Powder mages, colonial empires, revolutions", "group": ""}, {"name": "Magitech / Arcanepunk", "desc": "Industry + magic · Enchantment as infrastructure", "group": ""}, {"name": "Urban Fantasy Noir", "desc": "Detective noir + the supernatural · A tired investigator in a city of monsters", "group": ""}, {"name": "Historical Horror", "desc": "A real period + the uncanny · The past, with something wrong in it", "group": ""}, {"name": "Cyber-Cultivation", "desc": "Cyberpunk + Xianxia · Neural implants as meridians; corporations as sects", "group": ""}, {"name": "Regency Eldritch", "desc": "Regency romance + cosmic horror · Ballroom manners while something vast stirs", "group": ""}, {"name": "Samurai Space Opera", "desc": "Sengoku honour + starships · Feudal lords commanding fleets", "group": ""}, {"name": "Mecha Shogunate", "desc": "Feudal Japan + giant machines · Clan wars fought in walking armour", "group": ""}, {"name": "Wuxia Western", "desc": "Martial arts + the frontier · Sword saints on the railroad", "group": ""}, {"name": "Fae Mafia", "desc": "Organized crime + the fair folk · Debts, oaths and very literal contracts", "group": ""}, {"name": "Dungeon Bureaucracy", "desc": "Office drama + dungeon · Running the dungeon as a workplace", "group": ""}, {"name": "Cozy Apocalypse", "desc": "Slice of life + the end of the world · A tea shop in the wasteland", "group": ""}, {"name": "Victorian Monster Hunters", "desc": "Victorian society + the hunt · Etiquette by day, stakes by night", "group": ""}, {"name": "Gods in the Boardroo ": "Urban Fantasy", "desc": "Magic hidden inside the modern city", "group": ""}, {"name": "Paranormal", "desc": "Vampires, werewolves and witches among us", "group": ""}, {"name": "Gods Among Men", "desc": "Deities living hidden in the modern world", "group": ""}, {"name": "Angels and Demons", "desc": "Heaven and hell at war, with humanity as the ground", "group": ""}, {"name": "Portal Fantasy", "desc": "A doorway from our world to another", "group": ""}, {"name": "Magical Realism", "desc": "Magic treated as unremarkable in an ordinary world", "group": ""}, {"name": "Political Fantasy", "desc": "Thrones, councils and succession in a magical realm", "group": ""}, {"name": "Military Fantasy", "desc": "Mercenary companies and campaigns with battle-magic", "group": ""}, {"name": "Assassin Fantasy", "desc": "Guilds of killers, contracts and courts", "group": ""}, {"name": "Wuxia / Xianxia World", "desc": "Sects, martial realms and immortal ascension", "group": ""}, {"name": "Fantasy of Manners", "desc": "Society, etiquette and reputation, lightly enchanted", "group": ""}, {"name": "Gaslamp Fantasy", "desc": "Magic and mystery in a refined, darkened Victorian England", "group": ""}, {"name": "Gunpowder Fantasy", "desc": "Muskets and cannon alongside magic", "group": ""}, {"name": "Ancient Technology", "desc": "The magic is lost technology of a fallen civilization", "group": ""}, {"name": "Dying World", "desc": "Magic fading, the world ending slowly", "group": ""}, {"name": "New Weird", "desc": "Strange, grotesque cities that follow no genre rules", "group": ""}, {"name": "Fairytale", "desc": "Talking animals, magic beans, enchanted forests and bargains", "group": ""}, {"name": "Arthurian", "desc": "Camelot, the Grail and the Round Table", "group": ""}, {"name": "Norse Mythology", "desc": "The nine realms, Asgard and the Aesir", "group": ""}, {"name": "Greek Mythology", "desc": "Olympus, its gods, and their heroes", "group": ""}, {"name": "Egyptian Mythology", "desc": "Ra, rity, with real power", "group": ""}, {"name": "Power Object", "desc": "An object or property which grants the protagonist power", "group": ""}, {"name": "Entity of Power", "desc": "An entity of considerable power accompanies the protagonist", "group": ""}, {"name": "Virtual Reality", "desc": "Taking part in a simulated virtual world of fantasy", "group": ""}, {"name": "Artificial Intelligence", "desc": "Possessing an advanced AI as an assistant", "group": ""}, {"name": "Summoning", "desc": "Called into another world by its inhabitants, for their purpose", "group": ""}, {"name": "Reverse Isekai", "desc": "A being from another world arrives in ours", "group": ""}, {"name": "Returnee", "desc": "Comes back to the original world after years in another, changed", "group": ""}, {"name": "The System", "desc": "A game-like interface grants levels, quests and growth", "group": ""}, {"name": "Foreknowledge", "desc": "Knows the plot the world is about to follow", "group": ""}, {"name": "Villainess Role", "desc": "Wakes as the doomed antagonist of a known story", "group": ""}, {"name": "Non-human Rebirth", "desc": "Reborn as a monster, object or creature", "group": ""}, {"name": "Time Loop", "desc": "Death or a trigger resets time to a fixed point", "group": ""}, {"name": "Body Swap", "desc": "Exchanges bodies with someone in the same world", "group": ""}, {"name": "Hidden Heritage", "desc": "Secretly of a powerful bloodline or house", "group": ""}, {"name": "Inheritance", "desc": "Receives the legacy of a vanished master, order or civilization", "group": ""}, {"name": "Pact", "desc": "Bound by a contract to a being, with terms both ways", "group": ""}, {"name": "Amnesia", "desc": "Wakes with no memory, and the past is dangerous", "group": ""}, {"name": "World Transformation", "desc": "The world itself changes around the protagonist (gates, a System, the apocalypse)", "group": ""}, {"name": "Exile", "desc": "Cast out of rank, family or homeland, with something to prove", "group": ""}]}]}, {"id": "c15", "num": 15, "name": "Tone and Atmosphere", "intro": "Tone sets the Tonal Range of the Mode, and it is anchored by the Touchstone once the Proving Scene is played. The best pick is two options: a dominant tone and an undertone (grim with dry wit; cozy with melancholy). Tone does not set how graphic the Play is; that is the Intensity Ceiling.", "sets": "Tonal Range; Intensity Ceiling; Descriptive Density", "subs": [{"name": "", "mode": "several", "options": [{"name": "Grim", "desc": "Hard world, hard choices, costs that stay paid", "group": ""}, {"name": "Bleak", "desc": "Hope is scarce and usually misplaced", "group": ""}, {"name": "Gritty", "desc": "Realistic, dirty, physical and unglamorous", "group": ""}, {"name": "Heroic", "desc": "Courage matters and can win", "group": ""}, {"name": "Epic", "desc": "Vast stakes, grand scale, the weight of history", "group": ""}, {"name": "Hopeful", "desc": "Things can get better, and are worth the effort", "group": ""}, {"name": "Cozy", "desc": "Warm, safe, small and comforting", "group": ""}, {"name": "Whimsical", "desc": "Light, odd and charming", "group": ""}, {"name": "Playful", "desc": "Banter and mischief; nothing too heavy for long", "group": ""}, {"name": "Farcical", "desc": "Escalating absurdity and slapstick", "group": ""}, {"name": "Satirical", "desc": "Mockery with a target", "group": ""}, {"name": "Dry / Wry", "desc": "Understated wit in the telling", "group": ""}, {"name": "Romantic", "desc": "Longing, tension and tenderness", "group": ""}, {"name": "Melancholic", "desc": "Quiet sadness, loss and memory", "group": ""}, {"name": "Bittersweet", "desc": "Gains that cost something dear", "group": ""}, {"name": "Nostalgic", "desc": "A time or place remembered fondly", "group": ""}, {"name": "Tense", "desc": "Suspense in every scene; something may break", "group": ""}, {"name": "Ominous", "desc": "Something is coming, and it is not good", "group": ""}, {"name": "Dread", "desc": "Fear that builds : "Pantheon", "desc": "Many gods with domains, rivalries and cults", "group": ""}, {"name": "Dualism", "desc": "Two opposed powers, light and dark", "group": ""}, {"name": "Animism", "desc": "Spirits in every river, stone and beast", "group": ""}, {"name": "Shamanism", "desc": "Spirit journeys, healing rites and the shaman between worlds", "group": ""}, {"name": "Ancestor Veneration", "desc": "The dead are honoured at family shrines, consulted and feared", "group": ""}, {"name": "State Religion", "desc": "Faith as an arm of the crown", "group": ""}, {"name": "Competing Faiths", "desc": "Several churches contest the same souls", "group": ""}, {"name": "Syncretism", "desc": "Faiths blended into one practice", "group": ""}, {"name": "Mystery Cults", "desc": "Secret initiations, hidden knowledge", "group": ""}, {"name": "Gnostic Faith", "desc": "A flawed creator, a hidden true god, and salvation through knowledge", "group": ""}, {"name": "Mysticism", "desc": "Faith as direct experience: visions, trance, ecstasy", "group": ""}, {"name": "Gods Walk the Earth", "desc": "The divine is present, visible and political", "group": ""}, {"name": "Absent or Dead Gods", "desc": "Worship without answer, or after the funeral", "group": ""}, {"name": "Philosophical Faith", "desc": "A way of life more than a pantheon", "group": ""}, {"name": "Machine Cult / AI Worship", "desc": "Artificial intelligence or technology revered as divine", "group": ""}, {"name": "Eldritch Cult", "desc": "Devotion to something that should not be called", "group": ""}, {"name": "Secular World", "desc": "No faith of consequence; its absence is the theme", "group": ""}]}, {"name": "Real traditions to draw on", "mode": "several", "options": [{"name": "Christianity", "desc": "Churches, redemption and scripture", "group": ""}, {"name": "Catholicism", "desc": "Rome, saints, confession and papal authority", "group": ""}, {"name": "Protestantism", "desc": "Reformation, personal faith and the authority of scripture", , {"name": "Deicide", "desc": "The killing of a god", "group": ""}, {"name": "Persecution", "desc": "A faith driven underground", "group": ""}]}]}, {"id": "c18", "num": 18, "name": "Politics and Ideology", "intro": "Politics gives the world's factions their Wants, which the Operator writes as Stake Cards. It is chosen in three parts: the ideologies in play, the political situation the story opens into, and the political temperaments of individual Characters. The ideology families follow the standard classification (Wikipedia: List of political ideologies), described as their adherents would describe them. Depiction is not endorsement (§19.3), and whether the work validates or advocates any of them is set separately (§19.4).", "sets": "Faction Stake Cards; world rules", "subs": [{"name": "Ideologies in play", "mode": "several", "options": [{"name": "Monarchism / Legitimism", "desc": "The rightful ruler by blood or anointing", "group": ""}, {"name": "Traditionalism", "desc": "Keep the inherited order; distrust innovation", "group": ""}, {"name": "Conservatism", "desc": "Change slowly, and only what must change", "group": ""}, {"name": "Liberalism", "desc": "Individual rights, rule of law, limited power", "group": ""}, {"name": "Libertarianism", "desc": "Maximum liberty, minimal state", "group": ""}, {"name": "Socialism", "desc": "Collective ownership for the common good", "group": ""}, {"name": "Communism", "desc": "Classless, stateless society through revolution", "group": ""}, {"name": "Anarchism", "desc": "No rulers; voluntary association", "group": ""}, {"name": "Nationalism", "desc": "The nation's unity and sovereignty come first", "group": ""}, {"name": "Imperialism", "desc": "Expansion and dominion as destiny", "group": ""}, {"name": "Fascism", "desc": "The nation reborn under a single will", "group": ""}, {"name": "Authoritarianism", "desc": "Order through concentrated, unchecked power", "group": ""}, {"name": "Theocratic Rule", "desc": "Divine law as the law ofit from breaking it", "group": ""}]}, {"name": "Character political temperaments", "mode": "several", "options": [{"name": "Woke / Progressive", "desc": "Social-justice convictions and progressive values", "group": ""}, {"name": "Tumblerina", "desc": "Online-activist style: emotive, identity-focused, always engaged", "group": ""}, {"name": "Blue Sky Head", "desc": "Progressive convictions with an authoritarian streak about enforcing them", "group": ""}, {"name": "Nationalist", "desc": "Strong national identity and patriotism", "group": ""}, {"name": "Speciesist / Racist", "desc": "Holds other species or races to be lesser", "group": ""}, {"name": "Sons of Man Supremacist", "desc": "Holds human-descended minds (humans, their AI, their uplifts) above alien ones", "group": ""}, {"name": "Transhumanist", "desc": "Wants humanity improved through technology", "group": ""}, {"name": "Pronatalist", "desc": "Alarmed by falling birth rates; family and fertility come first", "group": ""}, {"name": "Rationalist / Effective Altruist", "desc": "Evidence, expected value, and optimizing the good", "group": ""}, {"name": "Far-Right", "desc": "Hard-line conservative and authoritarian", "group": ""}, {"name": "4chan /pol/", "desc": "Politically incorrect, conspiracy-minded online reactionary", "group": ""}, {"name": "4chan /b/", "desc": "Chaotic, edgy, transgressive humour for its own sake", "group": ""}, {"name": "Nazi", "desc": "National Socialist: authoritarian ethno-nationalism", "group": ""}, {"name": "Far-Left", "desc": "Revolutionary and radically progressive", "group": ""}, {"name": "Militant Feminist", "desc": "Combative advocate for women's rights", "group": ""}, {"name": "Religious Zealot", "desc": "Fundamentalist devotion that governs everything", "group": ""}, {"name": "Anarchist", "desc": "Against all authority; radical freedom", "group": ""}, {"name": "Eco-Extremist", "desc": "Nature before civilization, by any means", "group": ""}, {"name": "Corporate Capitalist", "d const KEY = "operative-mode:" + CONFIG.kind + "-menu";
let state = {picks:{}, oc:{}, rolled:{}, approach:null};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.picks) state = Object.assign(state, s); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

function el(tag, attrs, ...kids){ const n = document.createElement(tag);
  for (const k in (attrs||{})) { if (k === "class") n.className = attrs[k]; else if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); }
  for (const k of kids) if (k != null) n.append(k); return n; }
function rnd(n){ const a = new Uint32Array(1); const lim = Math.floor(0xFFFFFFFF / n) * n; let x; do { crypto.getRandomValues(a); x = a[0]; } while (x >= lim); return x % n; }
function key(cat, sub){ return cat.id + "|" + sub; }
function picksOf(cat, si){ return state.picks[key(cat, si)] || []; }
function catHas(cat){ return cat.subs.some((s, i) => picksOf(cat, i).length); }

document.getElementById("title").textContent = CONFIG.title;
document.getElementById("ver").textContent = CONFIG.version + " · Operative Mode Framework, Draft 0.4";
document.getElementById("lede").textContent = CONFIG.lede;
document.title = CONFIG.title;
document.getElementById("rollCore").textContent = CONFIG.core.label;

/* ---------- approach (Magic Menu) ---------- */
function renderApproach(){
  const box = document.getElementById("approachBox"); box.innerHTML = "";
  if (!CONFIG.approach) return;
  const wrap = el("div", {class:"approach"}, el("h2", {text:"Approach"}));
  const sub = el("div", {class:"sub", "data-mode":"one"});
  const grid = el("div", {class:"opts"});
  CONFIG.approach.forEach(a => {
    const b = el("button", {class:"opt", type:"button", "aria-pressed": String(state.approach === a.name)},
      el("span", {class:"seal"}), el("span", {}, el("span", {class:"nm", text:a.name}), el("span", {class:"ds", text:a.desc})));
    b.onclick = () => { setApproach(state.approach === a.name ? null : a.name); };
    grid.append(b);
  });
  sub.append(grid); wrap.append(sub); box.append(wrap);
  if (state.approach === "The Standard System")
    box.append(el("p", {class:"std-note", text:"The Standard System is adopted as written, so nothing else on this Menu is asked. Pick “The Standard System, tuned” instead if you want to change parts of it."}));
  if (state.approach === "Leave it to the Operator")
    box.append(el("p", {class:"std-note", text:"The Operator elects the whole system toward the Mode's Intent and declares the election. You can still pin any set below, and your pin wins."}));
}
function setApproach(name){
  state.approach = name;
  if (name === "The Standard System, tuned") {
    // preload the Standard values wherever the Player has not picked
    CATS.forEach(c => c.subs.forEach((s, i) => { const k = key(c, i);
      if (!(state.picks[k] || []).length && !state.oc[c.id]) state.picks[k] = s.options.filter(o => o.star).map(o => o.name); }));
  }
  save(); renderAll();
}

/* ---------- categories ---------- */
function optionButton(cat, si, sub, o){
  const on = picksOf(cat, si).includes(o.name);
  const nm = el("span", {class:"nm", text:o.name});
  const body = el("span", {}, nm);
  if (o.star) body.append(el("span", {class:"star", title:"The Standard System's value", text:"★"}));
  if (state.rolled[key(cat, si) + "|" + o.name] && on) body.append(el("span", {class:"rolled", text:"rolled"}));
  if (o.desc) body.append(el("span", {class:"ds", text:o.desc}));
  const b = el("button", {class:"opt", type:"button", "aria-pressed": String(on), "data-q": (o.name + " " + o.desc + " " + (o.group||"")).toLowerCase()}, el("span", {class:"seal"}), body);
  b.onclick = () => toggle(cat, si, sub, o.name, false);
  return b;
}
function toggle(cat, si, sub, name, rolled){
  const k = key(cat, si); let list = (state.picks[k] || []).slice();
  if (list.includes(name) && !rolled) list = list.filter(x => x !== name);
  else if (sub.mode === "one") list = [name];
  else if (!list.includes(name)) list.push(name);
  state.picks[k] = list;
  if (rolled) state.rolled[k + "|" + name] = true; else delete state.rolled[k + "|" + name];
  if (list.length) delete state.oc[cat.id];
  save(); renderCat(cat); renderSlip(); renderRail();
}
function roll(cat){
  // one draw per sub-list, among options not already picked
  cat.subs.forEach((s, i) => {
    const pool = s.mode === "one" ? s.options : s.options.filter(o => !picksOf(cat, i).includes(o.name));
    if (!pool.length) return;
    toggle(cat, i, s, pool[rnd(pool.length)].name, true);
  });
}
function renderCat(cat){
  const old = document.getElementById(cat.id);
  const sec = el("section", {class:"cat" + (state.oc[cat.id] ? " is-oc" : ""), id:cat.id});
  const modes = [...new Set(cat.subs.map(s => s.mode))];
  const h = el("div", {class:"cat-head"},
    el("h2", {}, el("span", {class:"num", text: cat.num + "."}), cat.name),
    el("span", {class:"badge", text: modes.length === 1 && modes[0] === "one" ? "Pick one" : "Pick any"}));
  sec.append(h);
  if (cat.sets) sec.append(el("p", {class:"cat-sets", text:"Sets: " + cat.sets}));
  if (cat.intro) { const d = el("details", {class:"about"}, el("summary", {text:"About this category"}), el("p", {text:cat.intro})); sec.append(d); }
  const oc = el("button", {class:"btn oc-btn", type:"button", "aria-pressed": String(!!state.oc[cat.id]), text:"Operator's Choice"});
  oc.onclick = () => { if (state.oc[cat.id]) delete state.oc[cat.id]; else { state.oc[cat.id] = true; cat.subs.forEach((s, i) => delete state.picks[key(cat, i)]); } save(); renderCat(cat); renderSlip(); renderRail(); };
  const rb = el("button", {class:"btn", type:"button", text:"Roll"}); rb.onclick = () => roll(cat);
  const cb = el("button", {class:"btn", type:"button", text:"Clear"});
  cb.onclick = () => { cat.subs.forEach((s, i) => delete state.picks[key(cat, i)]); delete state.oc[cat.id]; save(); renderCat(cat); renderSlip(); renderRail(); };
  sec.append(el("div", {class:"cat-tools"}, oc, rb, cb));
  cat.subs.forEach((s, i) => {
    const sub = el("div", {class:"sub", "data-mode":s.mode});
    if (s.name) sub.append(el("h3", {text: s.name + (s.mode === "one" && modes.length > 1 ? " (pick one)" : "")}));
    let grid = el("div", {class:"opts"}); let lastGroup = null;
    s.options.forEach(o => {
      if (o.group && o.group !== lastGroup) { if (grid.childNodes.length) sub.append(grid); sub.append(el("p", {class:"grp", text:o.group})); grid = el("div", {class:"opts"}); lastGroup = o.group; }
      grid.append(optionButton(cat, i, s, o));
    });
    sub.append(grid); sec.append(sub);
  });
  if (old) old.replaceWith(sec); else document.getElementById("main").append(sec);
  applySearch();
}
function renderRail(){
  const rail = document.getElementById("rail"); rail.innerHTML = "";
  let g = null;
  CATS.forEach(c => {
    if (c.group && c.group !== g) { rail.append(el("h2", {text:c.group})); g = c.group; }
    const n = c.subs.reduce((t, s, i) => t + picksOf(c, i).length, 0);
    const a = el("a", {href:"#" + c.id, class: state.oc[c.id] ? "oc" : (n ? "has" : "")}, el("span", {text:c.name}), el("span", {class:"n", text: state.oc[c.id] ? "OC" : (n || "")}));
    rail.append(a);
  });
}

/* ---------- slip ---------- */
function slipLines(){
  const lines = [], untouched = [], tunings = [];
  const tuned = state.approach === "The Standard System, tuned";
  CATS.forEach(c => {
    if (state.oc[c.id]) { lines.push({b:c.name, t:"Operator's Choice", oc:true}); if (tuned) tunings.push(c.name + ": Operator's Choice"); return; }
    let any = false;
    c.subs.forEach((s, i) => {
      const p = picksOf(c, i); if (!p.length) return; any = true;
      const shown = p.map(n => state.rolled[key(c, i) + "|" + n] ? n + " (rolled)" : n).join("; ");
      const std = s.options.filter(o => o.star).map(o => o.name).sort().join("; ");
      const isTune = tuned && p.slice().sort().join("; ") !== std;
      if (tuned && !isTune) return;  // unchanged from the Standard System: not worth listing
      lines.push({b: c.name + (s.name ? " / " + s.name : ""), t: shown, tune: isTune});
      if (isTune) tunings.push(c.name + ": " + p.join("; ") + (std ? "  (Standard: " + std + ")" : ""));
    });
    if (!any && !tuned) untouched.push(c.name);
  });
  return {lines, untouched, tunings};
}
function renderSlip(){
  const body = document.getElementById("slipBody"); body.innerHTML = "";
  const {lines, untouched} = slipLines();
  if (state.approach) body.append(el("ul", {}, el("li", {}, el("b", {text:"Approach"}), el("span", {text:state.approach}))));
  if (state.approach === "The Standard System") { body.append(el("p", {class:"left", text:"Nothing else is needed."})); updateOut(); return; }
  if (!lines.length && !state.approach) body.append(el("p", {class:"empty", text:"Nothing picked yet. Choose options, mark a category Operator's Choice, or roll."}));
  const ul = el("ul");
  lines.forEach(l => ul.append(el("li", {class: (l.oc ? "oc" : "") + (l.tune ? " tune" : "")}, el("b", {text:l.b}), el("span", {text:l.t}))));
  body.append(ul);
  if (untouched.length) body.append(el("p", {class:"left", text: untouched.length + " left untouched, so the Operator elects them: " + untouched.join(", ") + "."}));
  if (state.approach === "The Standard System, tuned") body.append(el("p", {class:"left", text: lines.length ? "Every other set stays as the Standard System has it (★)." : "No changes yet: every set is at its Standard value (★). Pick a different option anywhere to tune it."}));
  updateOut();
}
function asText(){
  const {lines, untouched, tunings} = slipLines();
  const out = [CONFIG.title.toUpperCase() + " PICKS (" + CONFIG.version + ")"];
  if (state.approach) out.push("Approach: " + state.approach);
  if (state.approach === "The Standard System") return out.join("\n");
  if (state.approach !== "The Standard System, tuned") lines.filter(l => !l.oc).forEach(l => out.push(l.b + ": " + l.t));
  else if (!tunings.length) out.push("No Tunings: every set at its Standard value.");
  const oc = lines.filter(l => l.oc).map(l => l.b);
  if (oc.length) out.push("Operator's Choice: " + oc.join(", "));
  if (tunings.length) { out.push("Tunings against the Standard System:"); tunings.forEach(t => out.push("- " + t)); }
  if (untouched.length) out.push("Untouched (Operator elects): " + untouched.join(", "));
  if (Object.keys(state.rolled).length) out.push("(rolled = Tool Draw from the browser's cryptographic random source)");
  return out.join("\n");
}
function updateOut(){ document.getElementById("out").value = asText(); }
function toast(t){ const n = document.getElementById("toast"); n.textContent = t; setTimeout(() => { if (n.textContent === t) n.textContent = ""; }, 2500); }
document.getElementById("copy").onclick = async () => {
  const text = asText();
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into the conversation."); return; } catch(e) {}
  const ta = document.getElementById("out"); ta.hidden = false; ta.value = text; ta.select();
  try { document.execCommand("copy"); toast("Copied. Paste it into the conversation."); } catch(e) { toast("Select the text below and copy it."); }
};
document.getElementById("show").onclick = () => { const ta = document.getElementById("out"); ta.hidden = !ta.hidden; updateOut(); };
document.getElementById("mobSlip").onclick = () => document.getElementById("slip").classList.toggle("open");

/* ---------- search, core roll, reset ---------- */
function applySearch(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  document.querySelectorAll("section.cat").forEach(sec => {
    let shown = 0;
    sec.querySelectorAll(".opt").forEach(b => { const hit = !q || b.dataset.q.includes(q) || sec.querySelector("h2").textContent.toLowerCase().includes(q); b.hidden = !hit; if (hit) shown++; });
    sec.querySelectorAll(".grp").forEach(g => { const grid = g.nextElementSibling; g.hidden = grid && ![...grid.children].some(b => !b.hidden); });
    sec.hidden = q && !shown;
  });
}
document.getElementById("q").oninput = applySearch;
document.getElementById("rollCore").onclick = () => {
  CONFIG.core.cats.forEach(name => {
    if (name === "<setting>") name = CONFIG.core.settings[rnd(CONFIG.core.settings.length)];
    const c = CATS.find(x => x.name === name);
    if (c) { c.subs.forEach((s, i) => { if (s.mode === "several") delete state.picks[key(c, i)]; }); roll(c); }
  });
  toast("Rolled. Each draw is marked in the picks.");
};
document.getElementById("reset").onclick = () => { if (!confirm("Clear every pick on this Menu?")) return; state = {picks:{}, oc:{}, rolled:{}, approach:null}; save(); renderAll(); };

function renderAll(){
  document.getElementById("main").innerHTML = "";
  renderApproach();
  const hideCats = state.approach === "The Standard System";
  CATS.forEach(renderCat);
  document.querySelectorAll("section.cat").forEach(s => s.style.display = hideCats ? "none" : "");
  renderRail(); renderSlip();
}
renderAll();
</script>
