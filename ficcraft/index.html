    <main class="main" id="view" tabindex="-1">

        <svg class="ic boot-sigil" aria-hidden="true" focusable="false"><use href="#i-sigil"></use></svg>
        <p class="boot-name">Ficcraft</p>
        <p class="boot-note">Opening the archive: your realms, threads and codex will appear here.</p>
      </div>
    </main>
  </div>
