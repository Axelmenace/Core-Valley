    if (!P()) return;
    Editor.flush();
    const m = UI.modal(`<button class="iconbtn x" type="button" data-x aria-label="Close">×</button><h2>Find and replace</h2>
      <div class="row2"><label class="field"><span>Find</span><input id="fr-q" autofocus autocomplete="off" value="${esc(last.q)}"></label>
        <label class="field"><span>Replace with</span><input id="fr-to" autocomplete="off" value="${esc(last.to)}"></label></div>
      <div class="find-opts"><label class="check"><input type="checkbox" id="fr-cs" ${last.cs ? "checked" : ""}> Match case</label>
        <label class="check"><input type="checkbox" id="fr-word" ${last.word ? "checked" : ""}> Whole words</label>
        <label class="check"><input type="checkbox" id="fr-meta" ${last.meta ? "checked" : ""}> Also titles, synopses and notes</label></div>
      <p class="muted" id="fr-sum" style="margin:0" aria-live="polite">Reading the manuscript…</p>
      <div class="find-list" id="fr-list"></div>
      <div class="modal-foot"><button class="btn" type="button" data-x>Close</button><button class="btn gild" type="button" data-all disabled>Replace all</button></div>`, { wide: true });
    const $q = $("#fr-q"), $to = $("#fr-to"), $sum = $("#fr-sum"), $list = $("#fr-list"), $all = $("[data-all]", m.el);
    let ready = false, found = { scenes: [], meta: { n: 0, ids: [] }, total: 0 };
    const opts = () => ({ cs: $("#fr-cs").checked, word: $("#fr-word").checked, meta: $("#fr-meta").checked });
    const run = () => {
      if (!ready) return;
      const q = $q.value, o = opts(); last = { q, to: $to.value, ...o };
      found = { scenes: [], meta: { n: 0, ids: [] }, total: 0 };
      if (!q) { $sum.textContent = "Type what to look for. The search covers every scene in the binder."; $list.innerHTML = ""; $all.disabled = true; return; }
      const re = pattern(q, o);
      for (const id of IX.order) { const hits = scan(S.texts.get(id) || "", re); if (hits.length) { found.scenes.push({ id, hits }); found.total += hits.length; } }
      if (o.meta) { found.meta = metaHits(re); found.total += found.meta.n; }
      const inText = found.total - found.meta.n;
      $sum.textContent = found.total ? `${fmtFull(inText)} in the text of ${found.scenes.length} scene${found.scenes.length === 1 ? "" : "s"}${o.meta ? `, ${fmtFull(found.meta.n)} in titles, synopses and notes` : ""}.` : "Nothing found.";
      $all.disabled = !found.total;
      $list.innerHTML = found.scenes.slice(0, 60).map(s => `<button type="button" class="find-scene" data-id="${s.id}"><span class="head"><span class="coord">${esc(IX.coord[s.id])}</span><b>${esc(node(s.id).title || "Untitled scene")}</b><span class="hud">${s.hits.length}</span></span>
        ${s.hits.slice(0, 3).map(h => `<span class="snip">${h.pre.length === 40 ? "…" : ""}${esc(h.pre)}<mark>${esc(h.hit)}</mark>${esc(h.post)}${h.post.length === 50 ? "…" : ""}</span>`).join("")}</button>`).join("")
        + (found.scenes.length > 60 ? `<p class="muted" style="margin:6px 2px">and ${found.scenes.length - 60} more scenes.</p>` : "");
    };
    const runSoon = debounce(run, 180);
    m.el.addEventListener("input", e => { if (e.target === $to) { last.to = $to.value; return; } runSoon(); });
    m.el.addEventListener("keydown", e => { if (e.key === "Enter" && e.target === $q) { e.preventDefault(); runSoon.flush(); const f = $(".find-scene", m.el); f && f.focus(); } });
    m.el.addEventListener("click", async e => {
      if (e.target.closest("[data-x]")) { m.close(); return; }
      const sc = e.target.closest(".find-scene");
      if (sc) {
        const q = $q.value, cs = opts().cs; m.close(); UI.openScene(sc.dataset.id);
        setTimeout(() => { try { getSelection().removeAllRanges(); window.find && window.find(q, cs, false, true); } catch { /* the scene is open either way */ } }, 350);
        return;
      }
      if (e.target.closest("[data-all]") && found.total) {
        const q = $q.value, to = $to.value, o = opts(), n = found.total;
        const r = await UI.ask(`Replace ${fmtFull(n)} match${n === 1 ? "" : "es"}?`, `Every “${esc(q)}” found becomes “${esc(to)}”${to ? "" : " (that is, it is removed)"}. A snapshot of each changed scene is taken first, so any of them can be put back from its Snapshots list.`, [["Cancel"], ["Replace all", "gild"]]);
        if (r !== 1 || !P()) return;
        const re = pattern(q, o); let done = 0, scenes = 0;
        $sum.textContent = "Replacing…"; $all.disabled = true;
        for (const s of found.scenes) {
          const out = replaceIn(S.texts.get(s.id) || "", re, to); if (!out.n) continue;
          await takeSnapshot(s.id, "Before replace", true);
          putText(s.id, out.html); setSceneWords(s.id, wordsOfHtml(out.html), false);
          done += out.n; scenes++;
        }
        if (o.meta) for (const id of found.meta.ids) { const nd = node(id); for (const f of META) if (nd[f]) nd[f] = String(nd[f]).replace(re, () => { done++; return to; }); }
        touch(); UI.redrawAll();
        UI.toast(`Replaced ${fmtFull(done)} match${done === 1 ? "" : "es"}${scenes ? ` across ${scenes} scene${scenes === 1 ? "" : "s"}` : ""}.`, { ms: 6000 });
        run();
      }
    });
    loadAllTexts().then(() => { ready = true; run(); }, err => { console.warn("manuscript not read", err); $sum.textContent = "The manuscript could not be read: " + ((err && err.message) || "storage did not answer") + "."; });
  }
  return { open, pattern, scan, replaceIn };
})();

/* ── main: settings, keys, boot ────────────────────────────────────────── */
function cacheSettings() { lsSet("settings", S.meta.settings); }
function applySettings(arg) {
  const st = { ...DEFAULT_SETTINGS, ...(arg || S.meta.settings || {}) };
  const r = document.documentElement;
  if (st.skin && st.skin !== "auto") r.dataset.skin = st.skin; else delete r.dataset.skin;
  const f = PROSE_FONTS.find(x => x[0] === st.font) || PROSE_FONTS[0];
  r.style.setProperty("--f-prose", f[2]);
  r.style.setProperty("--prose-size", st.size + "px");
  r.style.setProperty("--prose-lh", String(st.lh));
  r.style.setProperty("--measure", st.measure + "ch");
  Sky.set(!!st.ambience); Sky.retint();
  if (!arg) cacheSettings();
}

function bindKeys() {
  document.addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    if (e.key === "Escape") {
      if (UI.closeCtx()) return;
      if (UI.closeTopModal()) return;
      if (S.closePeek && S.closePeek()) return;
      if (S.focus) { UI.toggleFocus(false); return; }
      const d = $("#desk"); if (d.classList.contains("show-binder") || d.classList.contains("show-insp")) { d.classList.remove("show-binder", "show-insp"); return; }
      return;
    }
    if ($("#desk").hidden || !P()) { if (mod && k === "s") e.preventDefault(); return; }
    if ($("#modalRoot").childElementCount) return;
    if (mod && k === "k") { e.preventDefault(); UI.palette(); return; }
    if (mod && e.code === "Backslash") { e.preventDefault(); if (e.shiftKey) UI.toggleInspector(); else UI.toggleBinder(); return; }
    if (mod && !e.shiftKey && k === "s") { e.preventDefault(); flushAll(); Store.drain(4000).then(ok => UI.toast(ok ? "Saved." : "Still saving. Your work is queued and will retry.", { err: !ok })); return; }
    if (mod && e.shiftKey && k === "s") { e.preventDefault(); UI.snapshotActive(); return; }
    if (mod && e.shiftKey && k === "h") { e.preventDefault(); Find.open(); return; }
    if (mod && e.shiftKey && k === "f") { e.preventDefault(); UI.toggleFocus(); return; }
    if (mod && e.shiftKey && e.key === "Enter") { e.preventDefault(); Editor.exec("break"); return; }
    if (mod && e.altKey && k === "n") { e.preventDefault(); const n = addNode("scene", S.active || S.sel); UI.renderBinder(); UI.openScene(n.id); return; }
    if (mod && e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) { e.preventDefault(); UI.stepScene(e.key === "ArrowUp" ? -1 : 1); return; }
    if (e.altKey && !mod && /^Digit[1-6]$/.test(e.code)) { e.preventDefault(); UI.setMode(["write", "board", "outline", "threads", "codex", "progress"][+e.code.slice(5) - 1]); return; }
  });
  document.addEventListener("mousedown", e => { if (!e.target.closest("#ctx")) UI.closeCtx(); });
  window.addEventListener("blur", () => UI.closeCtx());
}

async function boot() {
  paintAstros();
  applySettings(lsGet("settings", DEFAULT_SETTINGS));
  Sky.init();
  Store.onStatus(s => {
    const el = $("#saveState"); if (!el) return;
    el.className = "save-state hud " + (s.state === "ok" ? "" : s.state);
    el.textContent = s.text; el.title = s.detail || (Store.kind() === "cloud" ? "Saved to your private archive" : Store.kind() === "local" ? "Saved in this browser" : "Not kept after this page closes");
  });
  const kind = await Store.init(msg => { $("#bootMsg").textContent = msg; });
  // The library must be read before anything can be saved: starting from an empty list after a failed
  // read would let the next save replace the real one.
  let failed = null;
  for (let i = 0; i < 3; i++) {
    try { await loadMeta(); failed = null; break; }
    catch (e) { failed = e; console.warn("library read failed", e); await new Promise(r => setTimeout(r, 700 * (i + 1))); }
  }
  if (failed) throw new Error("your library could not be read (" + ((failed && failed.message) || "storage did not answer") + "). Nothing has been changed.");
  applySettings();
  UI.bind(); Editor.bind($("#stage")); Views.bind($("#stage")); bindKeys();
  $("#boot").hidden = true; $("#app").hidden = false;
  if (kind === "memory") UI.toast("This browser is refusing storage. Download a backup before closing the page.", { err: true, ms: 10000 });
  if (Store.skippedCloud()) UI.toast("Working in this browser's storage for now. Projects in your private archive are not shown; reopen the page to try the archive again.", { err: true, ms: 12000 });
  // Ask the browser not to clear this site's storage on its own when space runs short or after a spell away.
  if (kind === "local" && S.meta.projects.length && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const last = lsGet("last", null);
  if (last && S.meta.projects.some(p => p.id === last)) {
    try { await openProject(last); UI.showDesk(); UI.backupNudge(); return; } catch (e) { console.warn(e); }
  }
  UI.showLibrary();
}

window.addEventListener("beforeunload", e => {
  if (P()) flushAll(true);
  if (Store.busy() || (Store.kind() === "memory" && S.meta.projects.length)) { e.preventDefault(); e.returnValue = ""; }
});
const checkRemoteSoon = debounce(() => UI.checkRemote(), 200);
document.addEventListener("visibilitychange", () => { if (document.hidden) { if (P()) flushAll(true); } else checkRemoteSoon(); });
window.addEventListener("focus", checkRemoteSoon);
setInterval(() => { if (P() && !document.hidden) UI.renderStatus(); }, 60000);

boot().catch(e => {
  console.error(e);
  $("#bootMsg").textContent = "Astrolabe could not start: " + (e && e.message ? e.message : e);
  if (!$("#bootRetry")) {
    const b = document.createElement("button"); b.id = "bootRetry"; b.type = "button"; b.className = "btn"; b.textContent = "Try again";
    b.onclick = () => location.reload(); $("#boot").appendChild(b);
    if (e && e.offerLocal) {
      const l = document.createElement("button"); l.type = "button"; l.className = "btn ghost"; l.textContent = "Work in this browser for now";
      l.onclick = () => { try { sessionStorage.setItem("astrolabe:skipCloud", "1"); } catch { /* storage blocked */ } location.reload(); };
      $("#boot").appendChild(l);
    }
  }
});

})();
</script>
</body>
